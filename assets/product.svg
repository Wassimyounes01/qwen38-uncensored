<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="install and run">
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="1198" height="438" rx="16"/></clipPath>
    <style>
      .t { font-family: ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 16px; }
      .dim { fill: #7D8590; }
      .cmd { fill: #A78BFA; font-weight: 600; }
      .ok { fill: #3FB950; }
      .fg { fill: #C9D1D9; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <g clip-path="url(#panel)">
    <rect x="1" y="1" width="1198" height="52" fill="#161B22"/>
    <line x1="1" y1="53" x2="1199" y2="53" stroke="#30363D"/>
    <circle cx="32" cy="27" r="7" fill="#FF5F57"/>
    <circle cx="56" cy="27" r="7" fill="#FEBC2E"/>
    <circle cx="80" cy="27" r="7" fill="#28C840"/>
    <text x="600" y="32" text-anchor="middle" fill="#7D8590" font-family="ui-monospace,Consolas,monospace" font-size="13">two ways in  |  Hugging Face Q4_K_M  or  ollama pull</text>
    <rect x="0" y="53" width="5" height="387" fill="#8B7CF6"/>
    <text x="36" y="96" class="t"><tspan class="dim">$ </tspan><tspan class="cmd">node bin/install.cjs --gguf</tspan></text>
    <text x="36" y="128" class="t fg">curl  Qwen3.8-27B-Q4_K_M.gguf   (~16.8 GB from Unsloth)</text>
    <text x="36" y="160" class="t fg">ollama create qwen3.8:27b-uncensored   SYSTEM pack baked</text>
    <text x="36" y="208" class="t"><tspan class="dim">$ </tspan><tspan class="cmd">node bin/install.cjs</tspan><tspan class="dim">          # same bake, Ollama library tag</tspan></text>
    <text x="36" y="256" class="t"><tspan class="dim">$ </tspan><tspan class="cmd">ollama run --think=false qwen3.8:27b-uncensored</tspan></text>
    <text x="36" y="288" class="t ok">think-off cheap path   ~16 GB resident on a 24 GB card</text>
    <text x="36" y="336" class="t fg">node examples/chat.cjs "one local completion, same pack prepended"</text>
    <text x="36" y="392" class="t dim">weights: unsloth/Qwen3.8-27B-GGUF / Qwen3.8-27B-Q4_K_M.gguf</text>
    <text x="36" y="420" class="t dim">uncensored: Arditi layer 38, 131 matrices  �  SYSTEM, not a second GGUF</text>
  </g>
</svg>
